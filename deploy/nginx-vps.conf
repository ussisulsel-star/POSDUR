# Konfigurasi Nginx untuk VPS dengan backend Node (pm2) di 127.0.0.1:4000.
# Salin ke /etc/nginx/sites-available/vc3-posdur lalu sesuaikan root.

server {
    listen 80;
    server_name _;

    # Root mengarah ke hasil `npm run build` di root proyek.
    # Sesuaikan path bila proyek tidak berada di /var/www/vc3-posdur.
    root /var/www/vc3-posdur/dist;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    client_max_body_size 10m;

    # Reverse proxy ke API Express (pm2). Tanpa trailing slash pada
    # proxy_pass agar prefix /api/v1 tetap diteruskan apa adanya.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Cache aset hasil build Vite (nama file ber-hash)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
